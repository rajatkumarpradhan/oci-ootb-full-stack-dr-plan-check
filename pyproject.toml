[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-ootb-full-stack-dr-plan-check"
version = "0.1.0"
description = "OCI Full Stack DR protection-group template plus an offline DR plan checker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-ootb-full-stack-dr-plan-check = "oci_ootb_full_stack_dr_plan_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
